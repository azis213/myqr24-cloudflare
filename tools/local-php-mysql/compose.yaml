name: myqr24-local-php-mysql

services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${LOCAL_MYSQL_DATABASE:?Set LOCAL_MYSQL_DATABASE in .env.local}
      MYSQL_USER: ${LOCAL_MYSQL_USER:?Set LOCAL_MYSQL_USER in .env.local}
      MYSQL_PASSWORD: ${LOCAL_MYSQL_PASSWORD:?Set LOCAL_MYSQL_PASSWORD in .env.local}
      MYSQL_ROOT_PASSWORD: ${LOCAL_MYSQL_ROOT_PASSWORD:?Set LOCAL_MYSQL_ROOT_PASSWORD in .env.local}
      TZ: UTC
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+00:00
      - --skip-log-bin
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping --host=127.0.0.1 --user=$$MYSQL_USER --password=$$MYSQL_PASSWORD --silent",
        ]
      interval: 3s
      timeout: 3s
      retries: 30
      start_period: 10s
    networks:
      - local_php_mysql
    volumes:
      - mysql_data:/var/lib/mysql

  tag-control-plane-verify:
    build:
      context: .
      dockerfile: Dockerfile.php
    environment:
      APP_ENV: testing
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      APP_DEBUG: "false"
      APP_URL: http://localhost
      APP_TIMEZONE: UTC
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_DATABASE: ${LOCAL_MYSQL_DATABASE:?Set LOCAL_MYSQL_DATABASE in .env.local}
      DB_USERNAME: ${LOCAL_MYSQL_USER:?Set LOCAL_MYSQL_USER in .env.local}
      DB_PASSWORD: ${LOCAL_MYSQL_PASSWORD:?Set LOCAL_MYSQL_PASSWORD in .env.local}
      DB_CHARSET: utf8mb4
      DB_COLLATION: utf8mb4_0900_ai_ci
      CACHE_STORE: array
      QUEUE_CONNECTION: sync
      SESSION_DRIVER: array
    depends_on:
      mysql:
        condition: service_healthy
    entrypoint: ["php"]
    command: ["/workspace/scripts/verify-tag-control-plane.php"]
    working_dir: /workspace/tag-control-plane
    networks:
      - local_php_mysql
    profiles:
      - verify-tcp
    volumes:
      - ./scripts:/workspace/scripts:ro
      - ../../apps/tag-control-plane:/workspace/tag-control-plane:ro

  php:
    build:
      context: .
      dockerfile: Dockerfile.php
    environment:
      APP_ENV: test
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      MYSQL_DATABASE: ${LOCAL_MYSQL_DATABASE:?Set LOCAL_MYSQL_DATABASE in .env.local}
      MYSQL_USER: ${LOCAL_MYSQL_USER:?Set LOCAL_MYSQL_USER in .env.local}
      MYSQL_PASSWORD: ${LOCAL_MYSQL_PASSWORD:?Set LOCAL_MYSQL_PASSWORD in .env.local}
    depends_on:
      mysql:
        condition: service_healthy
    entrypoint: ["php"]
    working_dir: /workspace
    networks:
      - local_php_mysql
    profiles:
      - verify
    volumes:
      - ./scripts:/workspace/scripts:ro
      - ../../apps/tag-control-plane:/workspace/tag-control-plane:ro

networks:
  local_php_mysql:
    internal: true

volumes:
  mysql_data:
