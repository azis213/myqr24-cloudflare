name = "myqr24-staging-test-pwa"
pages_build_output_dir = "dist"
compatibility_date = "2026-10-02"

# React Pages serves the static PWA shell. Tag content, sessions and media URLs
# are issued only by the separate D1/R2 Application API; Pages has no R2/D1,
# KV, secret or service bindings.
#
# Current staging project and temporary public URL:
#   myqr24-staging-test-pwa -> https://myqr24-staging-test-pwa.pages.dev
#
# Configure the custom staging domain after the first deployment:
#   app-staging.myqr24.com -> myqr24-staging-test-pwa
#
# Production will be a separate Pages project and custom domain.
#
# Future authenticated API integrations must be implemented as a separate
# application API boundary, never by exposing router secrets to Pages.
