name = "myqr24-tag-app-api"
main = "workers/app-api.ts"
compatibility_date = "2026-10-31"

[env.staging]
name = "myqr24-tag-app-api-staging"

[[env.staging.d1_databases]]
binding = "APP_DB"
database_name = "myqr24-stg-db"
database_id = "98760be7-c5dd-493d-89d6-cf6c08fbb393"
migrations_dir = "database/migrations"
# Update database/main.sql first, then generate the next numbered migration.

[[env.staging.r2_buckets]]
binding = "PRIVATE_CONTENT"
bucket_name = "myqr24-stg-blob"

[[env.staging.services]]
binding = "MEDIA_SIGNER"
service = "myqr24-media-signer-staging"

# Required server-only secrets, never browser variables or committed values:
# APP_BOOTSTRAP_SECRET_S01, APP_PIN_PEPPER_S01, APP_MEDIA_SIGNER_KEY_S01,
# APP_CONTENT_PUBLISH_KEY_S01 (Publisher für PUT /api/v1/tags/{tagId}/content;
# fehlt es, antwortet der Pfad fail-closed mit 503), TAG_CONTENT_API_KEY_S01
# (server-to-server Upload und explizites Löschen von Content-Items).
# Production and real deployment remain blocked by W3D.