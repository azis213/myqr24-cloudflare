name = "myqr24-edge-routing"
main = "src/index.ts"
compatibility_date = "2026-09-30"

# TypeScript source files are compiled by Wrangler automatically.
#
# Deployments are environment-specific. Create one KV namespace per environment,
# then replace the corresponding namespace IDs below.
#
# Required versioned Staging secrets:
#   npx wrangler secret put FEISTEL_SECRET_S01 --env staging
#   npx wrangler secret put TAG_HMAC_SECRET_S01 --env staging
#   npx wrangler secret put REDIRECT_SIGNING_SECRET_S01 --env staging
#
# Production secret-version names are intentionally not decided or configured
# during W0. Do not reuse Staging secrets or deploy this Staging binding set
# to Production.
#
# Configure the Worker routes in the Cloudflare dashboard after deployment:
#   s.myqr24.com/     -> myqr24-edge-routing-staging
#   s.myqr24.com/t/*  -> myqr24-edge-routing-staging
#   s.myqr24.com/t1/* -> myqr24-edge-routing-staging
#   s.qr4.uk/         -> myqr24-edge-routing-staging
#   s.qr4.uk/t/*      -> myqr24-edge-routing-staging
#   s.qr4.uk/t1/*     -> myqr24-edge-routing-staging
#   p.myqr24.com/     -> myqr24-edge-routing
#   p.myqr24.com/t/*  -> myqr24-edge-routing
#   p.myqr24.com/t1/* -> myqr24-edge-routing
#   p.qr4.uk/         -> myqr24-edge-routing
#   p.qr4.uk/t/*      -> myqr24-edge-routing
#   p.qr4.uk/t1/*     -> myqr24-edge-routing
#   www.myqr24.com/*  -> myqr24-edge-routing
#
# The www route is the only deliberately broad route. The explicit scan-root
# routes cover only /. Its handler permits only GET/HEAD on / and responds 404
# for every other www path.
# Do not bind staging and production to the same KV namespace or secrets.

[env.staging]
name = "myqr24-edge-routing-staging"

[env.staging.vars]
SCAN_ENVIRONMENT = "staging"

[[env.staging.kv_namespaces]]
binding = "TAG_CONFIG"
id = "e05d3c9ead4b40b389e0e63db098e87a"

[env.production]
name = "myqr24-edge-routing"

[env.production.vars]
SCAN_ENVIRONMENT = "production"

# [[env.production.kv_namespaces]]
# binding = "TAG_CONFIG"
# id = "<production-kv-namespace-id>"
