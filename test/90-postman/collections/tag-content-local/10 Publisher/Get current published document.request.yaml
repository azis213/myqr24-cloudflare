$kind: http-request
url: "{{hostname-tag-app}}/api/v1/tags/{{tag-id}}/content/document"
method: GET
auth:
  type: bearer
  credentials:
    token: "{{publisher-key}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('Dokument abrufbar', function () { pm.response.to.have.status(200); });
      pm.test('TAG-ID stimmt', function () { pm.expect(pm.response.json().tagId).to.eql(pm.environment.get('tag-id')); });
      if (pm.response.code === 200) { pm.environment.set('content-revision', pm.response.headers.get('X-Content-Revision')); }
    language: text/javascript
order: 1000
