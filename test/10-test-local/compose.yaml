name: myqr24-local-test

services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${LOCAL_MYSQL_DATABASE:?Set LOCAL_MYSQL_DATABASE in .env.local}
      MYSQL_USER: ${LOCAL_MYSQL_USER:?Set LOCAL_MYSQL_USER in .env.local}
      MYSQL_PASSWORD: ${LOCAL_MYSQL_PASSWORD:?Set LOCAL_MYSQL_PASSWORD in .env.local}
      MYSQL_ROOT_PASSWORD: ${LOCAL_MYSQL_ROOT_PASSWORD:?Set LOCAL_MYSQL_ROOT_PASSWORD in .env.local}
      LOCAL_MYSQL_TEST_DATABASE: ${LOCAL_MYSQL_TEST_DATABASE:?Set LOCAL_MYSQL_TEST_DATABASE in .env.local}
      TZ: UTC
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+00:00
      - --skip-log-bin
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping --host=127.0.0.1 --user=$${MYSQL_USER} --password=$${MYSQL_PASSWORD} --silent",
        ]
      interval: 3s
      timeout: 3s
      retries: 30
      start_period: 10s
    networks:
      - local_test
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql-init:/docker-entrypoint-initdb.d:ro

  tag-control-plane:
    build:
      context: .
      dockerfile: Dockerfile.php
    environment:
      APP_ENV: local
      APP_KEY: ${LOCAL_APP_KEY:?Set LOCAL_APP_KEY in .env.local}
      APP_DEBUG: "true"
      APP_URL: http://localhost:${LOCAL_TCP_PORT:-8080}
      APP_TIMEZONE: UTC
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_DATABASE: ${LOCAL_MYSQL_DATABASE:?Set LOCAL_MYSQL_DATABASE in .env.local}
      DB_USERNAME: ${LOCAL_MYSQL_USER:?Set LOCAL_MYSQL_USER in .env.local}
      DB_PASSWORD: ${LOCAL_MYSQL_PASSWORD:?Set LOCAL_MYSQL_PASSWORD in .env.local}
      TEST_DB_DATABASE: ${LOCAL_MYSQL_TEST_DATABASE:?Set LOCAL_MYSQL_TEST_DATABASE in .env.local}
      DB_CHARSET: utf8mb4
      DB_COLLATION: utf8mb4_0900_ai_ci
      CACHE_STORE: file
      QUEUE_CONNECTION: sync
      SESSION_DRIVER: file
      MAIL_MAILER: ${MAIL_MAILER:?Set MAIL_MAILER in .env.local}
      MAIL_HOST: ${MAIL_HOST:?Set MAIL_HOST in .env.local}
      MAIL_PORT: ${MAIL_PORT:?Set MAIL_PORT in .env.local}
      MAIL_SCHEME: ${MAIL_SCHEME:?Set MAIL_SCHEME in .env.local}
      MAIL_USERNAME: ${MAIL_USERNAME:?Set MAIL_USERNAME in .env.local}
      MAIL_PASSWORD: ${MAIL_PASSWORD:?Set MAIL_PASSWORD in .env.local}
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:?Set MAIL_FROM_ADDRESS in .env.local}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:?Set MAIL_FROM_NAME in .env.local}
      TCP_BOOTSTRAP_ADMIN_EMAIL: ${TCP_BOOTSTRAP_ADMIN_EMAIL:?Set TCP_BOOTSTRAP_ADMIN_EMAIL in .env.local}
      TCP_BOOTSTRAP_ADMIN_INITIAL_PASSWORD: ${TCP_BOOTSTRAP_ADMIN_INITIAL_PASSWORD:?Set TCP_BOOTSTRAP_ADMIN_INITIAL_PASSWORD in .env.local}
      TCP_EMAIL_MFA_ENABLED: ${TCP_EMAIL_MFA_ENABLED:?Set TCP_EMAIL_MFA_ENABLED in .env.local}
      LOCAL_CODEC_API_KEY: ${LOCAL_CODEC_API_KEY:?Set LOCAL_CODEC_API_KEY in .env.local}
    depends_on:
      mysql:
        condition: service_healthy
      tag-codec:
        condition: service_started
    entrypoint: ["sh"]
    command: ["/workspace/local-test/scripts/start-tag-control-plane.sh"]
    ports:
      - "${LOCAL_TCP_PORT:-8080}:8000"
    networks:
      - local_test
    volumes:
      - ../../apps/tag-control-plane:/workspace/tag-control-plane
      - ./scripts:/workspace/local-test/scripts:ro
      - tcp_storage:/workspace/tag-control-plane/storage

  tag-codec:
    build:
      context: .
      dockerfile: Dockerfile.codec
    working_dir: /workspace/edge-router
    environment:
      FEISTEL_SECRET_S01: ${LOCAL_CODEC_FEISTEL_SECRET:?Set LOCAL_CODEC_FEISTEL_SECRET in .env.local}
      TAG_CODEC_API_KEY_S01: ${LOCAL_CODEC_API_KEY:?Set LOCAL_CODEC_API_KEY in .env.local}
    command:
      [
        "sh",
        "-c",
        "npm install --no-audit --no-fund --package-lock=false && printf 'FEISTEL_SECRET_S01=%s\\nTAG_CODEC_API_KEY_S01=%s\\n' \"$$FEISTEL_SECRET_S01\" \"$$TAG_CODEC_API_KEY_S01\" > .dev.vars && npx wrangler dev --local --persist-to /tmp/wrangler --config wrangler.codec.toml --ip 0.0.0.0 --port 8788",
      ]
    networks:
      - local_test
    volumes:
      - ../../apps/edge-router:/workspace/edge-router
      - codec_node_modules:/workspace/edge-router/node_modules

  tag-control-center:
    image: node:22-alpine
    working_dir: /workspace/tag-control-center
    environment:
      TCC_TCP_PROXY_TARGET: http://tag-control-plane:8000
    depends_on:
      tag-control-plane:
        condition: service_started
    command:
      [
        "sh",
        "-c",
        "npm install --no-audit --no-fund && npm run dev -- --host 0.0.0.0",
      ]
    ports:
      - "${LOCAL_TCC_PORT:-5174}:5174"
    networks:
      - local_test
    volumes:
      - ../../apps/tag-control-center:/workspace/tag-control-center
      - tcc_node_modules:/workspace/tag-control-center/node_modules

networks:
  local_test:
    internal: false

volumes:
  mysql_data:
  tcp_storage:
  tcc_node_modules:
  codec_node_modules:
